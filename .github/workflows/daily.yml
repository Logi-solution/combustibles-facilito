name: Extraccion diaria Facilito

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        run: python scripts/scraper_facilito.py

      - name: Commit y push del CSV (repositorio publico)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_historica/
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear"
          else
            git commit -m "Datos del $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Commit y push del respaldo HTML (repositorio privado)
        if: hashFiles('respaldo_html/*.gz') != ''
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/seminarioalex08-bit/combustibles-facilito-respaldo.git /tmp/respaldo-repo
          cp respaldo_html/*.gz /tmp/respaldo-repo/respaldo_html/
          cd /tmp/respaldo-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add respaldo_html/
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear"
          else
            git commit -m "Respaldo del $(date -u +'%Y-%m-%d')"
            git push
          fi
